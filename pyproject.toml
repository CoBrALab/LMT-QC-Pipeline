[project]
name = "lmt-qc-pipeline"
version = "0.1.0"
description = "LMT QC pipeline: cleans a raw Live Mouse Tracker SQLite export, fills detection gaps, resolves ambiguous gaps via human-in-the-loop binary search, and validates pipeline accuracy against manual QC."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
